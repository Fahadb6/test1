[package]
name = "firecraft676/zill-platform"
version = "0.2.0"
description = "ZILL Desert Shade demo platform with same-origin Python API"

[dependencies]
"wasmer/python" = "^3.12.6"

[fs]
"/app" = "."
"/src" = "./wasmer_src"

[[command]]
name = "script"
module = "wasmer/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/src/main.py"]
env = ["PYTHONEXECUTABLE=/bin/python"]
